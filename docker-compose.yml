networks:
  web:
    external: true
  dicehoard:
    driver: bridge
    name: dicehoard
services:
  db:
    image: mongo:6.0
    container_name: dicehoard_db
    restart: unless-stopped
    command:
      - --storageEngine=wiredTiger
      - --replSet=rs0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-dicehoard}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
    volumes:
      - ${DICEHOARD_DATA_DIR:-/data/appdata/dicehoard}/db:/data/db
      - ./docker/mongo-init-replica.sh:/docker-entrypoint-initdb.d/mongo-init-replica.sh:ro
    networks:
      - dicehoard
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --quiet
          --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    container_name: dicehoard
    restart: unless-stopped
    build:
      context: ./
    environment:
      ROOT_URL: https://${DICEHOARD_HOST:-dnd.turnr.net}
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-dicehoard}:${MONGO_INITDB_ROOT_PASSWORD}@db:27017/dicecloud?authSource=admin
      MONGO_OPLOG_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-dicehoard}:${MONGO_INITDB_ROOT_PASSWORD}@db:27017/local?authSource=admin
      PORT: 3000
      NODE_ENV: production
      METEOR_SETTINGS: '{"public":{"environment":"production","disablePatreon":true}}'
      # MAIL_URL: smtp://EMAIL:PASSWORD@SERVER:PORT  # TBD
    # ports:
    #   - '3000:3000' #The internal port should match the port set in the environmental variables
    depends_on:
      db:
        condition: service_healthy
    labels:
      traefik.enable: true
      traefik.docker.network: web
      traefik.http.routers.hoard.entrypoints: public
      traefik.http.routers.hoard.rule: Host(`${DICEHOARD_HOST:-dnd.turnr.net}`)
      traefik.http.routers.hoard.tls: true
      traefik.http.routers.hoard.tls.certresolver: cloudflare
      traefik.http.services.hoard.loadbalancer.server.port: 3000
    networks:
      - web
      - dicehoard
